name:                zipZipLangCompiler
version:             0.2.0.0
github:              "ruzen42/zipZipLangCompiler"
license:             BSD-3-Clause
author:              "Jaroslav Mihajlenko"
maintainer:          "malledeferlive@gmail.com"
copyright:           "2025 Jaroslav Mihajlenko"

extra-source-files:
- README.md
- CHANGELOG.md

category:            System

description:         Please see the README on GitHub at <https://github.com/ruzen42/zipZipLangCompiler#readme>

dependencies:
- base >= 4.7 && < 5
- parsec >= 3.1.16.0
- optparse-applicative >= 0.18.0.0
- ansi-terminal >= 1.1.3
- containers >= 0.7
- mtl >= 2.3.1
- llvm-hs >= 9.0.1
- bytestring >= 0.12.2.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  zzc:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - zipZipLangCompiler
